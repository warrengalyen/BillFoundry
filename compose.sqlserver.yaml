# SQL Server overlay. Replaces PostgreSQL from compose.yaml.
#
#   docker compose -f compose.yaml -f compose.sqlserver.yaml up --build
#
# Isolated project name so this stack does not reuse PostgreSQL volumes.
# DEVELOPMENT ONLY. Those credentials are placeholders.

name: billfoundry-sql

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: !override
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # DEVELOPMENT ONLY. Override with MSSQL_SA_PASSWORD in a gitignored .env file.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-DevOnly_P@ssw0rd}
    ports: !override
      - "1433:1433"
    volumes: !override
      - sql-data:/var/opt/mssql
    healthcheck: !override
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__BillFoundry: "Server=db,1433;Database=BillFoundry;User Id=sa;Password=${MSSQL_SA_PASSWORD:-DevOnly_P@ssw0rd};TrustServerCertificate=True;MultipleActiveResultSets=True"

volumes:
  sql-data:
