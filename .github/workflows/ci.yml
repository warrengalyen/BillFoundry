name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BillFoundry.slnx

      - name: Build
        run: dotnet build BillFoundry.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test BillFoundry.slnx --no-build --configuration Release --verbosity minimal
