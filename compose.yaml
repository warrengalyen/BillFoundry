# Local BillFoundry + PostgreSQL environment (Community default).
# DEVELOPMENT ONLY. Passwords below are placeholders, not production secrets.
#
#   docker compose up --build
#
# SQL Server alternative:
#   docker compose -f compose.yaml -f compose.sqlserver.yaml up --build
#
# The web process applies pending EF Core migrations at startup because
# Database__ApplyMigrationsOnStartup=true. That option never drops the database.
# Identity development seed runs only because ASPNETCORE_ENVIRONMENT=Development.

name: billfoundry

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: billfoundry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevOnly_P@ssw0rd}
      POSTGRES_DB: billfoundry
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billfoundry -d billfoundry"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: src/BillFoundry.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSql
      Database__ApplyMigrationsOnStartup: "true"
      DataProtection__KeyPath: /app/data-protection-keys
      OrganizationLogoStorage__RootPath: /app/App_Data/organization-logos
      ConnectionStrings__BillFoundry: "Host=db;Port=5432;Database=billfoundry;Username=billfoundry;Password=${POSTGRES_PASSWORD:-DevOnly_P@ssw0rd};Timeout=30"
    ports:
      - "8080:8080"
    volumes:
      - data-protection-keys:/app/data-protection-keys
      - organization-logos:/app/App_Data/organization-logos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  pg-data:
  data-protection-keys:
  organization-logos:
