# PostgreSQL demo overlay. Replaces SQL Server from compose.yaml.
# Use the same two-file pattern as compose.demo.yaml:
#
#   docker compose -f compose.yaml -f compose.demo.postgres.yaml up --build
#
# Also valid standalone (inherits nothing from compose.yaml):
#
#   docker compose -f compose.demo.postgres.yaml up --build
#
# Web: http://localhost:8083
# Postgres: localhost:5433  (user billfoundry / DevOnly_P@ssw0rd)
#
# Isolated project name so this stack does not reuse SQL Server volumes.
# DEVELOPMENT/DEMO ONLY. Those credentials are placeholders.

name: billfoundry-pg-demo

services:
  db:
    image: postgres:16
    hostname: db
    environment: !override
      POSTGRES_USER: billfoundry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevOnly_P@ssw0rd}
      POSTGRES_DB: billfoundry
    ports: !override
      - "5433:5432"
    volumes: !override
      - pg-data:/var/lib/postgresql/data
    healthcheck: !override
      test: ["CMD-SHELL", "pg_isready -U billfoundry -d billfoundry"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      default:
        aliases:
          - db

  web:
    build:
      context: .
      dockerfile: src/BillFoundry.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSql
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__BillFoundry: "Host=db;Port=5432;Database=billfoundry;Username=billfoundry;Password=${POSTGRES_PASSWORD:-DevOnly_P@ssw0rd};Timeout=30"
      ForwardedHeaders__Enabled: "false"
      DemoMode__Enabled: "true"
      DemoSeed__Enabled: "true"
      DemoSeed__ResetOnStartup: "true"
      IdentitySeed__Enabled: "false"
      DataProtection__KeyPath: /app/data-protection-keys
      OrganizationLogoStorage__RootPath: /app/App_Data/organization-logos
    ports: !override
      - "8083:8080"
    volumes: !override
      - pg-data-protection-keys:/app/data-protection-keys
      - pg-organization-logos:/app/App_Data/organization-logos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      default:
        aliases:
          - web

volumes:
  pg-data:
  pg-data-protection-keys:
  pg-organization-logos:
