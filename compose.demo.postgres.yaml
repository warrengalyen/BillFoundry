# Local PostgreSQL stack for validating the Render public-demo database path.
# Does not replace compose.yaml (SQL Server remains the Community default).
#
#   docker compose -f compose.demo.postgres.yaml up --build
#
# Web: http://localhost:8081
# Postgres: localhost:5433  (user billfoundry / DevOnly_P@ssw0rd)
#
# DEVELOPMENT/DEMO ONLY. Those credentials are placeholders.

name: billfoundry-pg-demo

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: billfoundry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevOnly_P@ssw0rd}
      POSTGRES_DB: billfoundry
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billfoundry -d billfoundry"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: src/BillFoundry.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSql
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__BillFoundry: "Host=db;Port=5432;Database=billfoundry;Username=billfoundry;Password=${POSTGRES_PASSWORD:-DevOnly_P@ssw0rd}"
      ForwardedHeaders__Enabled: "false"
      DemoMode__Enabled: "true"
      DemoSeed__Enabled: "true"
      DemoSeed__ResetOnStartup: "true"
      IdentitySeed__Enabled: "false"
      DataProtection__KeyPath: /app/data-protection-keys
      OrganizationLogoStorage__RootPath: /app/App_Data/organization-logos
    ports:
      - "8081:8080"
    volumes:
      - pg-data-protection-keys:/app/data-protection-keys
      - pg-organization-logos:/app/App_Data/organization-logos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

volumes:
  pg-data:
  pg-data-protection-keys:
  pg-organization-logos:
