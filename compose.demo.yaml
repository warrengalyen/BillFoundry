# Public demonstration overlay. Use with the default PostgreSQL stack:
#   docker compose -f compose.yaml -f compose.demo.yaml up --build
#
# Or with SQL Server:
#   docker compose -f compose.yaml -f compose.sqlserver.yaml -f compose.demo.yaml up --build
#
# Production environment plus fictional demo seed. Identity development seed stays off.

services:
  web:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DemoMode__Enabled: "true"
      DemoSeed__Enabled: "true"
      DemoSeed__ResetOnStartup: "true"
      IdentitySeed__Enabled: "false"
      Database__ApplyMigrationsOnStartup: "true"
